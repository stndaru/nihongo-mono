<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="nihongo mono — a fast, lightweight Japanese verb dictionary and conjugation trainer. No login, works offline-ish, your progress stays in your browser."
    />
    <title>nihongo mono</title>
    <script>
      // Theme FOUC guard: must run before first paint.
      ;(function () {
        try {
          // default is light; only stored 'dark' or explicit 'system' follows the OS
          var t = localStorage.getItem('nihongo-mono:theme')
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
