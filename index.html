<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NihongoMono — a fast, no-login Japanese dictionary and trainer. 230,000+ words with conjugations, furigana, and example sentences; 740,000+ proper names; verb and vocabulary quizzes. Your progress stays in your browser."
    />
    <title>NihongoMono - Companion</title>
    <meta name="theme-color" content="#D97757" />
    <!-- rich link previews (Discord, Slack, X…). og:image is resolved
         against the page URL; replace with an absolute URL if a host
         ever complains. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NihongoMono" />
    <meta property="og:title" content="NihongoMono - Companion" />
    <meta
      property="og:description"
      content="A fast, no-login Japanese dictionary and trainer — 230,000+ words with conjugations, furigana, and examples, 740,000+ names, and quizzes that track your progress locally."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NihongoMono - Companion" />
    <meta
      name="twitter:description"
      content="A fast, no-login Japanese dictionary and trainer — 230,000+ words, conjugations, furigana, quizzes."
    />
    <meta name="twitter:image" content="/og.png" />
    <script>
      // Theme FOUC guard: must run before first paint.
      ;(function () {
        try {
          // default follows the OS; stored 'light'/'dark' are explicit picks
          var t = localStorage.getItem('nihongo-mono:theme')
          var dark =
            t === 'dark' ||
            (t !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          // font preferences (default sans/sans; stored 'serif' is an
          // explicit pick) — set pre-paint to avoid font flash
          if (localStorage.getItem('nihongo-mono:font-text') === 'serif')
            document.documentElement.dataset.fontText = 'serif'
          if (localStorage.getItem('nihongo-mono:font-ja') === 'serif')
            document.documentElement.dataset.fontJa = 'serif'
          // font sizes (default is the smallest; bigger is opt-in):
          // global root scale, Japanese text scale, furigana scale
          var sizeAttrs = {
            'nihongo-mono:font-size': 'fontSize',
            'nihongo-mono:font-ja-size': 'fontJaSize',
            'nihongo-mono:font-furigana-size': 'fontFuriganaSize',
          }
          for (var key in sizeAttrs) {
            var v = localStorage.getItem(key)
            if (v === 'large' || v === 'xlarge' || v === 'xxlarge')
              document.documentElement.dataset[sizeAttrs[key]] = v
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
